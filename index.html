<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>দৌড়ের উপর রাজনীতি (3D)</title>
    
    <!-- Three.js লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- CSS স্টাইল -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* টেক্সট সিলেক্ট হওয়া বন্ধ করতে */
        }

        body {
            overflow: hidden;
            background-color: #87CEEB;
            touch-action: none; /* মোবাইলে স্ক্রল বন্ধ করতে */
        }

        canvas {
            display: block;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #score-board {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
        }

        #instructions {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: right;
            font-size: 14px;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            border: 3px solid #f44336;
            z-index: 10;
        }

        #game-over h1 {
            font-size: 40px;
            margin-bottom: 10px;
            color: #f44336;
        }

        #game-over p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        #restart-btn {
            padding: 12px 24px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        #restart-btn:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- গেমের স্কোর এবং UI -->
    <div id="ui-container">
        <div id="score-board">স্কোর: <span id="score">0</span></div>
        <div id="instructions">
            <p>কম্পিউটারে: ← → বা A/D চাপুন</p>
            <p>মোবাইলে: ডানে-বামে সোয়াইপ করুন</p>
        </div>
    </div>

    <!-- গেম ওভার স্ক্রিন -->
    <div id="game-over" class="hidden">
        <h1>খেলা শেষ!</h1>
        <p>আপনি ধরা পড়েছেন!</p>
        <button id="restart-btn">আবার চেষ্টা করুন</button>
    </div>

    <!-- জাভাস্ক্রিপ্ট গেম লজিক -->
    <script>
        // ১. বেসিক সেটআপ (Scene, Camera, Renderer)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 10);
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ২. আলো (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ৩. অ্যাসেট লোডার (Textures)
        const textureLoader = new THREE.TextureLoader();

        // ৪. প্লেয়ার (CNG অটোরিকশা)
        const playerGeometry = new THREE.PlaneGeometry(2.5, 3);
        const cngTexture = textureLoader.load('assets/cng.png');
        const playerMaterial = new THREE.MeshStandardMaterial({ 
            map: cngTexture, 
            transparent: true,
            side: THREE.DoubleSide 
        });
        const player = new THREE.Mesh(playerGeometry, playerMaterial);
        player.position.y = 1.5;
        player.position.z = 0;
        player.castShadow = true;
        scene.add(player);

        // ৫. রাস্তা (Road)
        const roadTexture = textureLoader.load('assets/road.jpg');
        roadTexture.wrapS = THREE.RepeatWrapping;
        roadTexture.wrapT = THREE.RepeatWrapping;
        roadTexture.repeat.set(1, 10);

        const roadGeometry = new THREE.PlaneGeometry(12, 200);
        const roadMaterial = new THREE.MeshStandardMaterial({ map: roadTexture });
        const road = new THREE.Mesh(roadGeometry, roadMaterial);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0;
        road.receiveShadow = true;
        scene.add(road);

        // ৬. ভবন (Buildings)
        const buildingTexture = textureLoader.load('assets/building.png');
        const buildingMaterial = new THREE.MeshStandardMaterial({ 
            map: buildingTexture, 
            transparent: true 
        });

        const buildings = [];
        for (let i = 0; i < 30; i++) {
            // ডান পাশ
            const b1Geo = new THREE.PlaneGeometry(6, 10);
            const b1 = new THREE.Mesh(b1Geo, buildingMaterial);
            b1.position.set(9, 5, -i * 20);
            b1.rotation.y = -Math.PI / 4;
            b1.castShadow = true;
            scene.add(b1);
            buildings.push(b1);

            // বাম পাশ
            const b2Geo = new THREE.PlaneGeometry(6, 10);
            const b2 = new THREE.Mesh(b2Geo, buildingMaterial);
            b2.position.set(-9, 5, -i * 20);
            b2.rotation.y = Math.PI / 4;
            b2.castShadow = true;
            scene.add(b2);
            buildings.push(b2);
        }

        // ৭. বাধা (Obstacles)
        const obstacleTexture = textureLoader.load('assets/barricade.png');
        const obstacleMaterial = new THREE.MeshStandardMaterial({ 
            map: obstacleTexture, 
            transparent: true 
        });
        let obstacles = [];
        const laneWidth = 3.5;

        function spawnObstacle() {
            const geo = new THREE.PlaneGeometry(2.5, 1.5);
            const obs = new THREE.Mesh(geo, obstacleMaterial);
            
            const lane = Math.floor(Math.random() * 3) - 1; 
            obs.position.set(lane * laneWidth, 0.75, -100);
            scene.add(obs);
            obstacles.push(obs);
        }

        // ৮. গেম লজিক (Movement & Controls)
        let speed = 0.5;
        let score = 0;
        let isGameOver = false;
        let currentLane = 0;
        let targetX = 0;

        // কন্ট্রোল (কীবোর্ড)
        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > -1) {
                currentLane--;
            } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 1) {
                currentLane++;
            }
            targetX = currentLane * laneWidth;
        });

        // কন্ট্রোল (মোবাইল টাচ)
        let touchStartX = 0;
        window.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
        window.addEventListener('touchend', (e) => {
            if (isGameOver) return;
            let touchEndX = e.changedTouches[0].clientX;
            if (touchEndX < touchStartX - 30 && currentLane > -1) currentLane--;
            else if (touchEndX > touchStartX + 30 && currentLane < 1) currentLane++;
            targetX = currentLane * laneWidth;
        });

        // ৯. অ্যানিমেশন লুপ
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                player.position.x += (targetX - player.position.x) * 0.15;
                roadTexture.offset.y -= speed * 0.05;

                buildings.forEach(b => {
                    b.position.z += speed;
                    if (b.position.z > 10) b.position.z -= 600; 
                });

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed;

                    if (Math.abs(obs.position.z - player.position.z) < 2 && 
                        Math.abs(obs.position.x - player.position.x) < 1.5) {
                        gameOver();
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        score += 10;
                        document.getElementById('score').innerText = score;
                        speed += 0.02;
                    }
                }

                if (Math.random() < 0.02) spawnObstacle();
            }

            renderer.render(scene, camera);
        }

        // ১০. গেম ওভার এবং রিস্টার্ট
        function gameOver() {
            isGameOver = true;
            document.getElementById('game-over').classList.remove('hidden');
        }

        document.getElementById('restart-btn').addEventListener('click', () => {
            isGameOver = false;
            score = 0;
            speed = 0.5;
            currentLane = 0;
            targetX = 0;
            player.position.x = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('game-over').classList.add('hidden');
            
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
        });

        // রেসপন্সিভ উইন্ডো
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // গেম শুরু
        animate();
    </script>
</body>
</html>
